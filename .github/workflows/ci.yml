name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (bash, node, json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every shell file (including env templates)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find core automations setup.sh -name '*.sh' -o -name 'env.sh.tmpl' | sort)
          exit "$fail"

      - name: shellcheck (errors only — templates carry {{tokens}} by design)
        run: |
          sudo apt-get -yq install shellcheck >/dev/null
          fail=0
          while IFS= read -r f; do
            shellcheck -S error -s bash "$f" || fail=1
          done < <(find core automations -name '*.sh' ! -name '*.tmpl' | sort)
          exit "$fail"

      - name: node --check every relay worker
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::node --check failed"; fail=1; }
          done < <(find automations -name 'worker.js' | sort)
          exit "$fail"

      - name: validate every recipe.json
        run: |
          fail=0
          while IFS= read -r f; do
            jq -e '.name and .description and .tool and .status and .handlers and .requires' "$f" >/dev/null \
              || { echo "::error file=$f::recipe.json missing required keys"; fail=1; }
          done < <(find automations -name 'recipe.json' | sort)
          exit "$fail"

      - name: recipe table completeness (every recipe listed in the README)
        run: |
          fail=0
          while IFS= read -r f; do
            r=$(dirname "${f#automations/}")
            grep -q "automations/$r" README.md || { echo "::error::$r missing from README table"; fail=1; }
          done < <(find automations -name 'recipe.json' | sort)
          exit "$fail"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
