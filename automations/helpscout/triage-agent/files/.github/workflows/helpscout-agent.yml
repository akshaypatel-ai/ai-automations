name: Help Scout Triage Agent

# Event-driven only (no cron): Help Scout webhook → Cloudflare Worker relay →
# repository_dispatch → this workflow. workflow_dispatch is the manual
# reconcile/recovery button (empty item_id = scan recent active conversations +
# tracked items).
on:
  repository_dispatch:
    types: [ helpscout_event ]
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Conversation id; empty = reconcile everything watched'
        required: false
        default: ''
      item_type:
        description: 'Optional type hint (Conversation)'
        required: false
        default: 'Conversation'

# No pull-requests permission: this agent never writes code — it posts internal
# Help Scout notes and opens GitHub issues. contents: write is for the state branch.
permissions:
  contents: write
  issues: write

# One run per item at a time; queued runs are safe because every run processes
# "everything new since saved state", not just the event that woke it.
concurrency:
  group: helpscout-agent-${{ github.event.client_payload.item_id || inputs.item_id || 'reconcile' }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prefer a PAT: issues opened with the built-in GITHUB_TOKEN don't
      # trigger `issues:` workflows in this repo.
      GH_TOKEN: ${{ secrets.AGENT_GH_PAT || secrets.GITHUB_TOKEN }}
      # Auth for the AI brain: set ONE of these secrets. CLAUDE_CODE_OAUTH_TOKEN
      # (from `claude setup-token`, Pro/Max subscription) or ANTHROPIC_API_KEY
      # (pay-per-token). If both are set, the API key wins.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HELPSCOUT_APP_ID: ${{ secrets.HELPSCOUT_APP_ID }}
      HELPSCOUT_APP_SECRET: ${{ secrets.HELPSCOUT_APP_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same PAT for git pushes (the helpscout-agent-state branch).
          token: ${{ secrets.AGENT_GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Help Scout auth
        # api.sh fetches its own OAuth bearer token from the app id + secret,
        # so this first call exercises the whole credential chain.
        run: |
          [ -n "$HELPSCOUT_APP_ID" ] && [ -n "$HELPSCOUT_APP_SECRET" ] || { echo "::error::Set repo secrets HELPSCOUT_APP_ID + HELPSCOUT_APP_SECRET (Help Scout → My Apps → Create App gives the id/secret pair)."; exit 1; }
          bash scripts/helpscout-agent/api.sh GET "/v2/users/me" | jq -e '.id' >/dev/null
          echo "Help Scout auth OK"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id || inputs.item_id }}
          ITEM_TYPE: ${{ github.event.client_payload.item_type || inputs.item_type }}
          EVENT_KIND: ${{ github.event.client_payload.kind || 'manual' }}
        # Unset empty auth vars — an empty ANTHROPIC_API_KEY would shadow the
        # OAuth token in Claude Code's credential precedence.
        run: |
          # Trim whitespace pasted into the secrets; a stray space breaks the bearer token.
          ANTHROPIC_API_KEY="$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')"
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Set repo secret CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY (API billing)."
            exit 1
          fi
          bash scripts/helpscout-agent/agent-run.sh

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_id }}
          path: .agent-out/
          if-no-files-found: ignore
