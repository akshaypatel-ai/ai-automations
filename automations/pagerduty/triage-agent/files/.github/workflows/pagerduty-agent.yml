name: PagerDuty Triage Agent

# Event-driven only (no cron): PagerDuty v3 webhook → Cloudflare Worker relay →
# repository_dispatch → this workflow. workflow_dispatch is the manual
# reconcile/recovery button (empty item_id = scan open incidents + tracked items).
on:
  repository_dispatch:
    types: [ pagerduty_event ]
  workflow_dispatch:
    inputs:
      item_id:
        description: 'PagerDuty incident id; empty = reconcile everything watched'
        required: false
        default: ''
      item_type:
        description: 'Optional type hint (Incident)'
        required: false
        default: 'Incident'

# No issues/pull-requests permission: this agent's only write surface is
# PagerDuty incident notes. contents: write is for the state branch.
permissions:
  contents: write

# One run per item at a time; queued runs are safe because every run processes
# "everything new since saved state", not just the event that woke it.
concurrency:
  group: pagerduty-agent-${{ github.event.client_payload.item_id || inputs.item_id || 'reconcile' }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # For state-branch pushes. AGENT_GH_PAT is optional here — the built-in
      # token is enough because this agent never opens issues or PRs.
      GH_TOKEN: ${{ secrets.AGENT_GH_PAT || secrets.GITHUB_TOKEN }}
      # Auth for the AI brain: set ONE of these secrets. CLAUDE_CODE_OAUTH_TOKEN
      # (from `claude setup-token`, Pro/Max subscription) or ANTHROPIC_API_KEY
      # (pay-per-token). If both are set, the API key wins.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same PAT for git pushes (the pagerduty-agent-state branch).
          token: ${{ secrets.AGENT_GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check PagerDuty auth
        # PAGERDUTY_FROM_EMAIL (note attribution) comes from env.sh, not secrets.
        run: |
          [ -n "$PAGERDUTY_TOKEN" ] || { echo "::error::Set repo secret PAGERDUTY_TOKEN (PagerDuty → Integrations → API Access Keys — a read-write REST API key; posting notes needs write)."; exit 1; }
          bash scripts/pagerduty-agent/api.sh GET "/incidents?limit=1" | jq -e '.incidents' >/dev/null
          echo "PagerDuty auth OK"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id || inputs.item_id }}
          ITEM_TYPE: ${{ github.event.client_payload.item_type || inputs.item_type }}
          EVENT_KIND: ${{ github.event.client_payload.kind || 'manual' }}
        # Unset empty auth vars — an empty ANTHROPIC_API_KEY would shadow the
        # OAuth token in Claude Code's credential precedence.
        run: |
          # Trim whitespace pasted into the secrets; a stray space breaks the bearer token.
          ANTHROPIC_API_KEY="$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')"
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Set repo secret CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY (API billing)."
            exit 1
          fi
          bash scripts/pagerduty-agent/agent-run.sh

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_id }}
          path: .agent-out/
          if-no-files-found: ignore
