name: Figma Design Agent

# Everything arrives via the passcode-verified Figma webhook relay as
# repository_dispatch; workflow_dispatch is the manual test button.
on:
  repository_dispatch:
    types: [ figma_event ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'ask (manual test)'
        required: true
        default: 'ask'
      text:
        description: 'Question to answer (what would follow the trigger prefix)'
        required: true
      file_key:
        description: 'Figma file key (figma.com/design/<key>/…)'
        required: true
      root_id:
        description: 'Root comment id of the thread to reply to'
        required: true

permissions:
  contents: read

concurrency:
  group: figma-agent-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI brain
        run: bash -c 'source scripts/figma-agent/ai/brain.sh && ai_install'

      - name: Run agent
        env:
          ASK_TEXT: ${{ github.event.client_payload.text || inputs.text }}
          FILE_KEY: ${{ github.event.client_payload.file_key || inputs.file_key }}
          ROOT_ID: ${{ github.event.client_payload.root_id || inputs.root_id }}
        run: |
          curl -sf -H "X-Figma-Token: $FIGMA_TOKEN" https://api.figma.com/v1/me | jq -e '.id' >/dev/null \
            || { echo "::error::FIGMA_TOKEN missing or invalid — figma.com/settings → Personal access tokens (scopes: file_comments:write + files:read)."; exit 1; }
          ANTHROPIC_API_KEY="$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')"
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          OPENAI_API_KEY="$(printf '%s' "${OPENAI_API_KEY:-}" | tr -d '[:space:]')"
          GEMINI_API_KEY="$(printf '%s' "${GEMINI_API_KEY:-}" | tr -d '[:space:]')"
          [ -z "$OPENAI_API_KEY" ] && unset OPENAI_API_KEY
          [ -z "$GEMINI_API_KEY" ] && unset GEMINI_API_KEY
          if ! bash -c 'source scripts/figma-agent/ai/brain.sh && ai_check'; then
            echo "::error::Brain auth/deps check failed — set the secret(s) named above."
            exit 1
          fi
          case "${{ github.event_name }}" in
            repository_dispatch) MODE=ask ;;
            workflow_dispatch)   MODE="${{ inputs.mode }}" ;;
          esac
          export MODE
          bash scripts/figma-agent/agent-run.sh

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_id }}
          path: .agent-out/
          if-no-files-found: ignore
