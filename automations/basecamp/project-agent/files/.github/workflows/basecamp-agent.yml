name: Basecamp Project Agent

# Event-driven only (no cron): Basecamp webhook → Cloudflare Worker relay →
# repository_dispatch → this workflow. workflow_dispatch is the manual
# reconcile/recovery button (empty item_id = scan watched columns/todolists
# plus every tracked item).
on:
  repository_dispatch:
    types: [ basecamp_event ]
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Item ID to process (leave empty to reconcile everything watched)'
        required: false
        default: ''
      item_type:
        description: 'Optional type hint (Kanban::Card, Todo, Message, Document, Upload, Question::Answer, Schedule::Entry)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# One run per item at a time; queued runs are safe because every run processes
# "everything new since saved state", not just the event that woke it.
concurrency:
  group: basecamp-agent-${{ github.event.client_payload.item_id || inputs.item_id || 'reconcile' }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prefer a PAT: PRs opened with the built-in GITHUB_TOKEN don't trigger
      # pull_request workflows and need manual approval.
      GH_TOKEN: ${{ secrets.AGENT_GH_PAT || secrets.GITHUB_TOKEN }}
      # Auth for the AI brain: set ONE of these secrets. CLAUDE_CODE_OAUTH_TOKEN
      # (from `claude setup-token`, Pro/Max subscription) or ANTHROPIC_API_KEY
      # (pay-per-token). If both are set, the API key wins.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Force file-based credential storage so the Basecamp CLI reads the
      # seeded credentials.json instead of probing the runner's keyring.
      BASECAMP_NO_KEYRING: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same PAT for git pushes, so branch pushes also trigger CI.
          token: ${{ secrets.AGENT_GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Basecamp CLI
        run: |
          curl -fsSL -o /tmp/basecamp.tar.gz \
            "$(gh api repos/basecamp/basecamp-cli/releases/latest \
                 --jq '.assets[] | select(.name | test("^basecamp_.*_linux_amd64\\.tar\\.gz$")) | .browser_download_url')"
          mkdir -p /tmp/basecamp-cli
          tar -xzf /tmp/basecamp.tar.gz -C /tmp/basecamp-cli
          sudo install -m 0755 "$(find /tmp/basecamp-cli -name basecamp -type f | head -1)" /usr/local/bin/basecamp
          basecamp --version

      - name: Seed Basecamp auth
        env:
          BASECAMP_CREDENTIALS_JSON: ${{ secrets.BASECAMP_CREDENTIALS_JSON }}
        run: |
          source scripts/basecamp-agent/env.sh
          mkdir -p ~/.config/basecamp
          printf '%s' "$BASECAMP_CREDENTIALS_JSON" > ~/.config/basecamp/credentials.json
          chmod 600 ~/.config/basecamp/credentials.json
          printf '{\n  "account_id": "%s"\n}\n' "$BC_ACCOUNT_ID" > ~/.config/basecamp/config.json
          basecamp auth status

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id || inputs.item_id }}
          ITEM_TYPE: ${{ github.event.client_payload.item_type || inputs.item_type }}
          EVENT_KIND: ${{ github.event.client_payload.kind || 'manual' }}
        # Unset empty auth vars — an empty ANTHROPIC_API_KEY would shadow the
        # OAuth token in Claude Code's credential precedence.
        run: |
          # Trim whitespace pasted into the secrets; a stray space breaks the bearer token.
          ANTHROPIC_API_KEY="$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')"
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Set repo secret CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY (API billing)."
            exit 1
          fi
          bash scripts/basecamp-agent/agent-run.sh

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_id }}
          path: .agent-out/
          if-no-files-found: ignore
