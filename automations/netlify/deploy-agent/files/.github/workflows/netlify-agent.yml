name: Netlify Deploy Agent

# Event-driven only (no cron): Netlify "Deploy failed" notification → Cloudflare
# Worker relay → repository_dispatch → this workflow. workflow_dispatch is the
# manual reconcile/recovery button (empty item_id = scan recent failed deploys
# + tracked items).
on:
  repository_dispatch:
    types: [ netlify_event ]
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Netlify deploy id; empty = reconcile everything watched'
        required: false
        default: ''
      item_type:
        description: 'Optional type hint (Deploy)'
        required: false
        default: 'Deploy'

permissions:
  contents: write
  issues: write

# One run per item at a time; queued runs are safe because every run processes
# "everything new since saved state", not just the event that woke it.
concurrency:
  group: netlify-agent-${{ github.event.client_payload.item_id || inputs.item_id || 'reconcile' }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prefer a PAT: issues filed with the built-in GITHUB_TOKEN are authored
      # by github-actions[bot] and never trigger issue-event workflows.
      GH_TOKEN: ${{ secrets.AGENT_GH_PAT || secrets.GITHUB_TOKEN }}
      # Auth for the AI brain: set ONE of these secrets. CLAUDE_CODE_OAUTH_TOKEN
      # (from `claude setup-token`, Pro/Max subscription) or ANTHROPIC_API_KEY
      # (pay-per-token). If both are set, the API key wins.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same PAT for git pushes (the state branch), for a consistent author.
          token: ${{ secrets.AGENT_GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Netlify auth
        run: |
          [ -n "$NETLIFY_TOKEN" ] || { echo "::error::Set repo secret NETLIFY_TOKEN (app.netlify.com → User settings → Applications → Personal access tokens)."; exit 1; }
          source scripts/netlify-agent/env.sh
          bash scripts/netlify-agent/api.sh GET "/sites/$NETLIFY_SITE_ID" | jq -e '.id' >/dev/null
          echo "Netlify auth OK"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id || inputs.item_id }}
          ITEM_TYPE: ${{ github.event.client_payload.item_type || inputs.item_type }}
          EVENT_KIND: ${{ github.event.client_payload.kind || 'manual' }}
        # Unset empty auth vars — an empty ANTHROPIC_API_KEY would shadow the
        # OAuth token in Claude Code's credential precedence.
        run: |
          # Trim whitespace pasted into the secrets; a stray space breaks the bearer token.
          ANTHROPIC_API_KEY="$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN:-}" | tr -d '[:space:]')"
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Set repo secret CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY (API billing)."
            exit 1
          fi
          bash scripts/netlify-agent/agent-run.sh

      - name: Upload agent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_id }}
          path: .agent-out/
          if-no-files-found: ignore
